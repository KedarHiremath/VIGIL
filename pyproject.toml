[project]
name = "vigil"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KedarHiremath", email = "kedarhiremath2004@gmail.com" },
    { name = "kriti03ka", email = "kritikakhedkar.20@gmail.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=19.0.1",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.9",
    "reportlab>=5.0.1",
    "tzdata",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
"pytest>=8.0",
"ruff>=0.9",
]

[project.scripts]
vigil = "vigil:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vigil"
module-root = "src"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
